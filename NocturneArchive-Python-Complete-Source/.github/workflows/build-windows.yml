name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm NocturneArchive.spec
      - uses: actions/upload-artifact@v4
        with:
          name: NocturneArchive-Windows
          path: dist/NocturneArchive.exe
